# ============================================
# DOCKER COMPOSE - LOCAL DEVELOPMENT
# Run: docker compose up --build
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offera-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # The AI route uses OpenRouter. GEMINI_API_KEY used to be passed here and
      # was read by nothing, while OPENROUTER_API_KEY — which IS required —
      # was missing and only survived via env_file.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Optional: durable rate limiting. Falls back to in-memory when unset.
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
